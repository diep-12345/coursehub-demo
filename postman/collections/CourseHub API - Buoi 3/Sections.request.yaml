$kind: http-request
url: "{{base_url}}/sections/WEB-01"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Section has required fields\", function () {\r

      \    const data = pm.response.json();\r

      \r

      \    pm.expect(data).to.have.property(\"section_id\");\r

      \    pm.expect(data).to.have.property(\"capacity\");\r

      \    pm.expect(data).to.have.property(\"enrolled\");\r

      \    pm.expect(data).to.have.property(\"remaining\");\r

      });"
    language: text/javascript
order: 6000
