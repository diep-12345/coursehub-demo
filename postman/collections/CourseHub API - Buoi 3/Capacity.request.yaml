    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test(\"Capacity restored to 3\", function () {\r

      \    pm.expect(pm.response.json().capacity).to.eql(3);\r

      });"
    language: text/javascript
order: 7000
